<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B263B"/>
      <stop offset="45%" stop-color="#415A77"/>
      <stop offset="75%" stop-color="#778DA9"/>
      <stop offset="100%" stop-color="#E0A96D"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243347"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="340" fill="url(#twilightSky)"/>

  <!-- Low Evening Sun / Horizon Glow -->
  <circle cx="480" cy="310" r="45" fill="#FCEADE" opacity="0.6"/>

  <!-- Sea Ocean Surface -->
  <rect y="330" width="800" height="170" fill="url(#oceanGrad)"/>

  <!-- Horizon Water Reflections -->
  <line x1="420" y1="340" x2="540" y2="340" stroke="#FCEADE" stroke-width="2" opacity="0.5"/>
  <line x1="440" y1="355" x2="520" y2="355" stroke="#FCEADE" stroke-width="2" opacity="0.4"/>
  <line x1="455" y1="375" x2="505" y2="375" stroke="#FCEADE" stroke-width="1.5" opacity="0.3"/>

  <!-- Distant Archipelago Islands (Atmospheric silhouettes) -->
  <path d="M 0 330 L 80 290 L 190 330 Z" fill="#3D5066" opacity="0.7"/>
  <path d="M 230 330 L 320 280 L 410 330 Z" fill="#2E3E50" opacity="0.8"/>
  <path d="M 540 330 L 650 270 L 780 330 Z" fill="#222F3D" opacity="0.9"/>

  <!-- Dramatic Foreground Limestone Cliff & Sea Arch -->
  <path d="M -20 500 L 0 200 C 60 180 120 230 160 210 C 200 240 240 220 270 290 C 230 350 200 420 180 500 Z" fill="#141E28"/>
  
  <!-- Coastal Wooden Lighthouse / Stilt Watchtower -->
  <rect x="235" y="240" width="10" height="50" fill="#E0A96D"/>
  <polygon points="230,240 250,240 240,225" fill="#A8422B"/>
  <circle cx="240" cy="245" r="4" fill="#FFE3A8"/>
  <line x1="240" y1="245" x2="380" y2="280" stroke="#FFE3A8" stroke-width="1.5" opacity="0.3"/>

  <!-- Palm / Tropical Tree Silhouettes on Cliff Edge -->
  <path d="M 90 200 C 95 170 120 160 130 150 C 110 165 95 185 90 200 Z" fill="#0D141B"/>
  <path d="M 130 150 C 145 140 165 145 175 155 C 155 155 140 155 130 150 Z" fill="#0D141B"/>
  <path d="M 130 150 C 135 130 145 125 155 120 C 145 135 138 145 130 150 Z" fill="#0D141B"/>

  <!-- Coastal Fishing Boat Silhouette -->
  <polygon points="430,360 480,360 495,350 420,350" fill="#0D141B"/>
  <line x1="455" y1="350" x2="455" y2="320" stroke="#0D141B" stroke-width="2"/>
  <polygon points="455,322 475,338 455,342" fill="#EAEAEA" opacity="0.8"/>

  <!-- Editorial Badge Header -->
  <g transform="translate(40, 40)">
    <rect width="250" height="32" rx="4" fill="#0D1B2A" stroke="#778DA9" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#E0A96D"/>
    <text x="30" y="20" fill="#F8F8F6" font-family="monospace" font-size="11" letter-spacing="1">VISUAL DEVELOPMENT • 2D ART</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171A"/>
      <stop offset="100%" stop-color="#1F262D"/>
    </linearGradient>
    <pattern id="matrixPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#526B83" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgCvGrad)"/>
  <rect width="800" height="500" fill="url(#matrixPattern)"/>

  <!-- Left: Face ROI Haar Detection Window -->
  <g transform="translate(60, 90)">
    <!-- Video Feed Container -->
    <rect width="320" height="320" rx="6" fill="#0C0E10" stroke="#333D47" stroke-width="2"/>
    
    <!-- Face Silhouette wireframe -->
    <ellipse cx="160" cy="150" rx="70" ry="90" fill="none" stroke="#3E4C59" stroke-width="1.5" stroke-dasharray="4,4"/>
    <ellipse cx="160" cy="210" rx="40" ry="20" fill="none" stroke="#3E4C59" stroke-width="1.5"/>
    <line x1="130" y1="135" x2="150" y2="135" stroke="#526B83" stroke-width="2"/>
    <line x1="170" y1="135" x2="190" y2="135" stroke="#526B83" stroke-width="2"/>

    <!-- Haar Bounding Box (Muted Cyan/Blue) -->
    <rect x="75" y="55" width="170" height="210" fill="#526B83" fill-opacity="0.08" stroke="#526B83" stroke-width="2"/>
    
    <!-- Bounding Corner Brackets -->
    <path d="M 65 75 L 65 45 L 95 45" fill="none" stroke="#6887A6" stroke-width="3"/>
    <path d="M 225 45 L 255 45 L 255 75" fill="none" stroke="#6887A6" stroke-width="3"/>
    <path d="M 65 245 L 65 275 L 95 275" fill="none" stroke="#6887A6" stroke-width="3"/>
    <path d="M 225 275 L 255 275 L 255 245" fill="none" stroke="#6887A6" stroke-width="3"/>

    <!-- Tag & Confidence -->
    <rect x="75" y="25" width="150" height="20" fill="#526B83"/>
    <text x="82" y="39" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold">ROI: FACE [98.4%]</text>

    <!-- Scan Line -->
    <line x1="75" y1="160" x2="245" y2="160" stroke="#6887A6" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Flow Connector with Arrow -->
  <g transform="translate(395, 235)">
    <line x1="0" y1="15" x2="45" y2="15" stroke="#526B83" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="45,10 55,15 45,20" fill="#526B83"/>
  </g>

  <!-- Right: CNN Feature Maps & Classification Tensors -->
  <g transform="translate(465, 80)">
    <!-- Layer 1: Conv2D Feature Matrix -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="60" height="60" rx="3" fill="#1C242C" stroke="#465868" stroke-width="1.5"/>
      <rect x="15" y="15" width="60" height="60" rx="3" fill="#242E38" stroke="#526B83" stroke-width="1.5"/>
      <rect x="30" y="30" width="60" height="60" rx="3" fill="#2E3A46" stroke="#6887A6" stroke-width="1.5"/>
      <text x="15" y="115" fill="#8E9DAE" font-family="monospace" font-size="10">Conv2D (64)</text>
    </g>

    <!-- Layer 2: Pooling & Activation -->
    <g transform="translate(130, 60)">
      <rect x="0" y="0" width="45" height="45" rx="3" fill="#1F2831" stroke="#526B83" stroke-width="1.5"/>
      <rect x="12" y="12" width="45" height="45" rx="3" fill="#2C3844" stroke="#6887A6" stroke-width="1.5"/>
      <text x="5" y="85" fill="#8E9DAE" font-family="monospace" font-size="10">MaxPool</text>
    </g>

    <!-- Layer 3: Dense Softmax Output Bars -->
    <g transform="translate(210, 20)">
      <rect width="105" height="230" rx="4" fill="#0E1114" stroke="#2D3742" stroke-width="1"/>
      <text x="12" y="24" fill="#F8F8F6" font-family="monospace" font-size="10" font-weight="bold">OUTPUT LOGITS</text>

      <!-- Class 1 -->
      <text x="12" y="55" fill="#8E9DAE" font-family="monospace" font-size="9">Joy</text>
      <rect x="12" y="62" width="80" height="8" rx="2" fill="#1C242C"/>
      <rect x="12" y="62" width="74" height="8" rx="2" fill="#2A9D8F"/>

      <!-- Class 2 -->
      <text x="12" y="90" fill="#8E9DAE" font-family="monospace" font-size="9">Neutral</text>
      <rect x="12" y="97" width="80" height="8" rx="2" fill="#1C242C"/>
      <rect x="12" y="97" width="16" height="8" rx="2" fill="#526B83"/>

      <!-- Class 3 -->
      <text x="12" y="125" fill="#8E9DAE" font-family="monospace" font-size="9">Surprise</text>
      <rect x="12" y="132" width="80" height="8" rx="2" fill="#1C242C"/>
      <rect x="12" y="132" width="8" height="8" rx="2" fill="#526B83"/>

      <!-- Class 4 -->
      <text x="12" y="160" fill="#8E9DAE" font-family="monospace" font-size="9">Gesture: OK</text>
      <rect x="12" y="167" width="80" height="8" rx="2" fill="#1C242C"/>
      <rect x="12" y="167" width="68" height="8" rx="2" fill="#6887A6"/>

      <!-- FPS Telemetry -->
      <line x1="12" y1="192" x2="92" y2="192" stroke="#2D3742" stroke-width="1"/>
      <text x="12" y="212" fill="#2A9D8F" font-family="monospace" font-size="10" font-weight="bold">48.4 FPS [CPU]</text>
    </g>
  </g>

  <!-- Editorial Badge Header -->
  <g transform="translate(40, 40)">
    <rect width="260" height="32" rx="4" fill="#0E1114" stroke="#526B83" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#526B83"/>
    <text x="30" y="20" fill="#F8F8F6" font-family="monospace" font-size="11" letter-spacing="1">PYTHON • OPENCV • TENSORFLOW</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15191E"/>
      <stop offset="100%" stop-color="#1F2833"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#portalBg)"/>

  <!-- Browser Window Frame -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="8" fill="#0E1217" stroke="#313B45" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="680" height="36" rx="8" fill="#181E26"/>
    <!-- Window controls -->
    <circle cx="20" cy="18" r="5" fill="#E63946"/>
    <circle cx="36" cy="18" r="5" fill="#E9C46A"/>
    <circle cx="52" cy="18" r="5" fill="#2A9D8F"/>

    <!-- URL Bar -->
    <rect x="180" y="8" width="320" height="20" rx="4" fill="#0E1217"/>
    <text x="210" y="22" fill="#8E9DAE" font-family="monospace" font-size="10">https://mtq-pcr.portal.ac.id/admin/scoring</text>

    <!-- Sidebar Navigation -->
    <rect x="0" y="36" width="160" height="364" fill="#13171D"/>
    <text x="24" y="70" fill="#526B83" font-family="sans-serif" font-size="11" font-weight="bold">MTQ PCR 2024</text>

    <!-- Nav Items -->
    <rect x="16" y="88" width="128" height="26" rx="4" fill="#1E2732"/>
    <text x="28" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="11">Live Scoring</text>
    
    <text x="28" y="138" fill="#8E9DAE" font-family="sans-serif" font-size="11">Participants (320)</text>
    <text x="28" y="168" fill="#8E9DAE" font-family="sans-serif" font-size="11">Jury Panels (12)</text>
    <text x="28" y="198" fill="#8E9DAE" font-family="sans-serif" font-size="11">Certificates</text>
    <text x="28" y="228" fill="#8E9DAE" font-family="sans-serif" font-size="11">Audit Logs</text>

    <!-- Main Content Area -->
    <!-- Metric Cards -->
    <g transform="translate(180, 56)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="145" height="65" rx="4" fill="#161C24" stroke="#2B3642" stroke-width="1"/>
      <text x="12" y="22" fill="#8E9DAE" font-family="sans-serif" font-size="10">Active Delegates</text>
      <text x="12" y="48" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="bold">324</text>

      <!-- Metric 2 -->
      <rect x="160" y="0" width="145" height="65" rx="4" fill="#161C24" stroke="#2B3642" stroke-width="1"/>
      <text x="12" y="22" fill="#8E9DAE" font-family="sans-serif" font-size="10">Submitted Scores</text>
      <text x="12" y="48" fill="#2A9D8F" font-family="monospace" font-size="18" font-weight="bold">98.2%</text>

      <!-- Metric 3 -->
      <rect x="320" y="0" width="155" height="65" rx="4" fill="#161C24" stroke="#2B3642" stroke-width="1"/>
      <text x="12" y="22" fill="#8E9DAE" font-family="sans-serif" font-size="10">Certificates Issued</text>
      <text x="12" y="48" fill="#526B83" font-family="monospace" font-size="18" font-weight="bold">320 / 320</text>
    </g>

    <!-- Data Table / Live Leaderboard -->
    <g transform="translate(180, 140)">
      <rect width="475" height="235" rx="4" fill="#13181F" stroke="#2B3642" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect width="475" height="28" rx="4" fill="#1A212A"/>
      <text x="16" y="18" fill="#8E9DAE" font-family="monospace" font-size="10">RANK</text>
      <text x="60" y="18" fill="#8E9DAE" font-family="monospace" font-size="10">DELEGATE NAME</text>
      <text x="210" y="18" fill="#8E9DAE" font-family="monospace" font-size="10">CATEGORY</text>
      <text x="330" y="18" fill="#8E9DAE" font-family="monospace" font-size="10">SCORE</text>
      <text x="410" y="18" fill="#8E9DAE" font-family="monospace" font-size="10">STATUS</text>

      <!-- Row 1 -->
      <line x1="0" y1="65" x2="475" y2="65" stroke="#222B36" stroke-width="1"/>
      <text x="20" y="50" fill="#E9C46A" font-family="monospace" font-size="11" font-weight="bold">#1</text>
      <text x="60" y="50" fill="#FFFFFF" font-family="sans-serif" font-size="11">Ahmad Zaky (Delegasi TI)</text>
      <text x="210" y="50" fill="#8E9DAE" font-family="sans-serif" font-size="11">Tilawah Dewasa</text>
      <text x="330" y="50" fill="#2A9D8F" font-family="monospace" font-size="11" font-weight="bold">96.80</text>
      <rect x="410" y="38" width="50" height="18" rx="3" fill="#2A9D8F" fill-opacity="0.2"/>
      <text x="418" y="51" fill="#2A9D8F" font-family="monospace" font-size="9">VERIFIED</text>

      <!-- Row 2 -->
      <line x1="0" y1="105" x2="475" y2="105" stroke="#222B36" stroke-width="1"/>
      <text x="20" y="90" fill="#CCCCCC" font-family="monospace" font-size="11" font-weight="bold">#2</text>
      <text x="60" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="11">Fathur Rahman (Delegasi TE)</text>
      <text x="210" y="90" fill="#8E9DAE" font-family="sans-serif" font-size="11">Hifzhil Quran 5 Juz</text>
      <text x="330" y="90" fill="#2A9D8F" font-family="monospace" font-size="11" font-weight="bold">94.25</text>
      <rect x="410" y="78" width="50" height="18" rx="3" fill="#2A9D8F" fill-opacity="0.2"/>
      <text x="418" y="91" fill="#2A9D8F" font-family="monospace" font-size="9">VERIFIED</text>

      <!-- Row 3 -->
      <line x1="0" y1="145" x2="475" y2="145" stroke="#222B36" stroke-width="1"/>
      <text x="20" y="130" fill="#CD7F32" font-family="monospace" font-size="11" font-weight="bold">#3</text>
      <text x="60" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="11">Syifa Salsabila (Delegasi TRPL)</text>
      <text x="210" y="130" fill="#8E9DAE" font-family="sans-serif" font-size="11">Tartil Quran</text>
      <text x="330" y="130" fill="#2A9D8F" font-family="monospace" font-size="11" font-weight="bold">92.40</text>
      <rect x="410" y="118" width="50" height="18" rx="3" fill="#2A9D8F" fill-opacity="0.2"/>
      <text x="418" y="131" fill="#2A9D8F" font-family="monospace" font-size="9">VERIFIED</text>
    </g>
  </g>
</svg>

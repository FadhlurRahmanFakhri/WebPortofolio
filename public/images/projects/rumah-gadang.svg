<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heritageBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1714"/>
      <stop offset="60%" stop-color="#2D221A"/>
      <stop offset="100%" stop-color="#4A382A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#heritageBg)"/>

  <!-- Warm ambient sunlight beam -->
  <polygon points="550,0 750,0 450,500 250,500" fill="#EADBC8" opacity="0.08"/>

  <!-- Majestic Multi-Tier Gonjong Roof Silhouette -->
  <!-- Left Outer Spike -->
  <path d="M 120 180 C 140 110 90 40 50 10 C 90 70 140 110 180 140 Z" fill="#9C6644" stroke="#1B1714" stroke-width="1.5"/>
  <!-- Left Inner Spike -->
  <path d="M 230 150 C 250 80 210 25 180 0 C 210 50 250 90 280 120 Z" fill="#7F4F24" stroke="#1B1714" stroke-width="1.5"/>
  
  <!-- Center Main Arch -->
  <path d="M 280 120 C 340 90 380 60 400 30 C 420 60 460 90 520 120 Z" fill="#582F0E" stroke="#1B1714" stroke-width="2"/>
  
  <!-- Right Inner Spike -->
  <path d="M 520 120 C 550 90 590 50 620 0 C 590 25 550 80 570 150 Z" fill="#7F4F24" stroke="#1B1714" stroke-width="1.5"/>
  <!-- Right Outer Spike -->
  <path d="M 620 140 C 660 110 710 70 750 10 C 710 40 660 110 680 180 Z" fill="#9C6644" stroke="#1B1714" stroke-width="1.5"/>

  <!-- Sweeping Eaves Main Roof Line -->
  <path d="M 60 180 C 220 230 580 230 740 180 L 710 240 C 550 280 250 280 90 240 Z" fill="#B08968" stroke="#1B1714" stroke-width="2"/>

  <!-- Timber House Facade Walls -->
  <polygon points="110,240 690,240 670,360 130,360" fill="#65452A" stroke="#1B1714" stroke-width="2"/>

  <!-- Carved Floral Relief Panels (Grid pattern) -->
  <g fill="#DDB892" opacity="0.6">
    <circle cx="170" cy="270" r="10"/>
    <circle cx="230" cy="270" r="10"/>
    <circle cx="290" cy="270" r="10"/>
    <circle cx="350" cy="270" r="10"/>
    <circle cx="410" cy="270" r="10"/>
    <circle cx="470" cy="270" r="10"/>
    <circle cx="530" cy="270" r="10"/>
    <circle cx="590" cy="270" r="10"/>
    <circle cx="630" cy="270" r="10"/>

    <circle cx="170" cy="320" r="10"/>
    <circle cx="230" cy="320" r="10"/>
    <circle cx="290" cy="320" r="10"/>
    <circle cx="350" cy="320" r="10"/>
    <circle cx="410" cy="320" r="10"/>
    <circle cx="470" cy="320" r="10"/>
    <circle cx="530" cy="320" r="10"/>
    <circle cx="590" cy="320" r="10"/>
    <circle cx="630" cy="320" r="10"/>
  </g>

  <!-- Foundation Pillars / Wooden Stilts -->
  <g fill="#3D2614">
    <rect x="150" y="360" width="16" height="90"/>
    <rect x="220" y="360" width="14" height="90"/>
    <rect x="290" y="360" width="14" height="90"/>
    <rect x="360" y="360" width="16" height="90"/>
    <rect x="430" y="360" width="16" height="90"/>
    <rect x="500" y="360" width="14" height="90"/>
    <rect x="570" y="360" width="14" height="90"/>
    <rect x="640" y="360" width="16" height="90"/>
  </g>

  <!-- Stone Foundation Bases -->
  <g fill="#7F7F7F">
    <ellipse cx="158" cy="450" rx="14" ry="6"/>
    <ellipse cx="227" cy="450" rx="12" ry="5"/>
    <ellipse cx="297" cy="450" rx="12" ry="5"/>
    <ellipse cx="368" cy="450" rx="14" ry="6"/>
    <ellipse cx="438" cy="450" rx="14" ry="6"/>
    <ellipse cx="507" cy="450" rx="12" ry="5"/>
    <ellipse cx="577" cy="450" rx="12" ry="5"/>
    <ellipse cx="648" cy="450" rx="14" ry="6"/>
  </g>

  <!-- Editorial Badge Header -->
  <g transform="translate(40, 40)">
    <rect width="260" height="32" rx="4" fill="#140E0A" stroke="#7F4F24" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#DDB892"/>
    <text x="30" y="20" fill="#F8F8F6" font-family="monospace" font-size="11" letter-spacing="1">ARCHITECTURAL 3D ARCHIVE</text>
  </g>
</svg>

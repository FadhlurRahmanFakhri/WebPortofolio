<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3B47"/>
      <stop offset="60%" stop-color="#465868"/>
      <stop offset="100%" stop-color="#8397A7"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <rect width="800" height="500" fill="url(#gridPattern)"/>

  <!-- Sun / Twilight glow -->
  <circle cx="620" cy="180" r="110" fill="#EADBC8" opacity="0.25"/>

  <!-- Distant mountain silhouette -->
  <path d="M 0 340 L 140 260 L 320 320 L 510 240 L 680 310 L 800 270 L 800 500 L 0 500 Z" fill="#1E2831" opacity="0.6"/>

  <!-- Ground Plane with Perspective Perspective Lines -->
  <path d="M 0 380 L 800 380 L 800 500 L 0 500 Z" fill="#151C22"/>
  <line x1="120" y1="380" x2="0" y2="500" stroke="#526B83" stroke-width="1.5" opacity="0.4"/>
  <line x1="280" y1="380" x2="200" y2="500" stroke="#526B83" stroke-width="1.5" opacity="0.4"/>
  <line x1="440" y1="380" x2="420" y2="500" stroke="#526B83" stroke-width="1.5" opacity="0.4"/>
  <line x1="600" y1="380" x2="640" y2="500" stroke="#526B83" stroke-width="1.5" opacity="0.4"/>
  <line x1="720" y1="380" x2="800" y2="450" stroke="#526B83" stroke-width="1.5" opacity="0.4"/>

  <!-- 3D Wireframe Traditional House Structure -->
  <!-- Pillars / Stilts -->
  <rect x="220" y="320" width="14" height="110" fill="#D89D66"/>
  <rect x="280" y="310" width="12" height="120" fill="#B77A42"/>
  <rect x="360" y="310" width="12" height="120" fill="#B77A42"/>
  <rect x="420" y="320" width="14" height="110" fill="#D89D66"/>

  <!-- House Body Main Cube -->
  <polygon points="200,320 440,320 420,220 220,220" fill="#E8D5B5" stroke="#1A2026" stroke-width="2"/>
  <polygon points="440,320 520,290 500,200 420,220" fill="#CBB694" stroke="#1A2026" stroke-width="2"/>

  <!-- Curved Horn Roof (Gonjong style) -->
  <path d="M 170 230 C 220 200 240 130 190 90 C 240 140 300 170 320 180 C 340 170 400 140 450 90 C 400 130 420 200 470 230 Z" fill="#6A452B" stroke="#1A2026" stroke-width="2"/>
  <path d="M 320 180 C 370 160 450 140 540 80 C 490 120 490 180 540 205 L 450 225 Z" fill="#4E321E" stroke="#1A2026" stroke-width="2"/>

  <!-- Carved Wooden Veranda Panels -->
  <line x1="230" y1="260" x2="410" y2="260" stroke="#875630" stroke-width="2"/>
  <line x1="230" y1="285" x2="410" y2="285" stroke="#875630" stroke-width="2"/>
  <line x1="260" y1="260" x2="260" y2="320" stroke="#875630" stroke-width="1.5"/>
  <line x1="310" y1="260" x2="310" y2="320" stroke="#875630" stroke-width="1.5"/>
  <line x1="360" y1="260" x2="360" y2="320" stroke="#875630" stroke-width="1.5"/>

  <!-- 3D Transform Gizmo Indicator -->
  <g transform="translate(640, 390)">
    <circle cx="0" cy="0" r="40" fill="#1E2831" stroke="#526B83" stroke-width="1.5"/>
    <!-- X Axis (Red) -->
    <line x1="0" y1="0" x2="26" y2="0" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
    <text x="32" y="4" fill="#E63946" font-family="monospace" font-size="11" font-weight="bold">X</text>
    <!-- Y Axis (Green) -->
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round"/>
    <text x="-4" y="-32" fill="#2A9D8F" font-family="monospace" font-size="11" font-weight="bold">Y</text>
    <!-- Z Axis (Blue) -->
    <line x1="0" y1="0" x2="-18" y2="18" stroke="#457B9D" stroke-width="3" stroke-linecap="round"/>
    <text x="-28" y="28" fill="#457B9D" font-family="monospace" font-size="11" font-weight="bold">Z</text>
  </g>

  <!-- Editorial Badge Overlay -->
  <g transform="translate(40, 40)">
    <rect width="210" height="32" rx="4" fill="#151C22" fill-opacity="0.85" stroke="#526B83" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#2A9D8F"/>
    <text x="30" y="20" fill="#F8F8F6" font-family="monospace" font-size="11" letter-spacing="1">BLENDER 3D • PRODUCTION IP</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roadSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192026"/>
      <stop offset="100%" stop-color="#2D3A45"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#roadSky)"/>

  <!-- Road Surface Perspective -->
  <polygon points="360,180 440,180 750,500 50,500" fill="#14191E" stroke="#313B45" stroke-width="1.5"/>

  <!-- Lane Dividers (Dashed Perspective) -->
  <line x1="387" y1="180" x2="280" y2="500" stroke="#E5E5E5" stroke-width="3" stroke-dasharray="16,12" opacity="0.6"/>
  <line x1="413" y1="180" x2="520" y2="500" stroke="#E5E5E5" stroke-width="3" stroke-dasharray="16,12" opacity="0.6"/>

  <!-- Virtual Detection Tripwire / Gate Overlay -->
  <line x1="180" y1="360" x2="620" y2="360" stroke="#E63946" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="635" y="364" fill="#E63946" font-family="monospace" font-size="10" font-weight="bold">TRIPWIRE #01</text>

  <!-- Tracked Vehicle 1 (Center Lane Sedan) -->
  <g transform="translate(360, 270)">
    <!-- Bounding Box -->
    <rect x="-40" y="-40" width="100" height="75" fill="#526B83" fill-opacity="0.15" stroke="#2A9D8F" stroke-width="2"/>
    <text x="-40" y="-48" fill="#2A9D8F" font-family="monospace" font-size="9" font-weight="bold">ID #104 : SEDAN [96%]</text>
    <text x="-40" y="-36" fill="#FFFFFF" font-family="monospace" font-size="9">v: 62.4 km/h</text>
    
    <!-- Stylized Top-Down/Angle Car Silhouette -->
    <polygon points="-20,20 40,20 30,-20 -10,-20" fill="#3D4E5E"/>
    <!-- Windshield -->
    <polygon points="-8,5 28,5 24,-12 -4,-12" fill="#6887A6"/>
  </g>

  <!-- Tracked Vehicle 2 (Left Lane SUV) -->
  <g transform="translate(180, 370)">
    <!-- Bounding Box -->
    <rect x="-50" y="-55" width="125" height="100" fill="#526B83" fill-opacity="0.15" stroke="#E69542" stroke-width="2"/>
    <text x="-50" y="-62" fill="#E69542" font-family="monospace" font-size="10" font-weight="bold">ID #098 : SUV [98%]</text>
    <text x="-50" y="-48" fill="#FFFFFF" font-family="monospace" font-size="9">v: 71.8 km/h</text>
    
    <polygon points="-30,35 55,35 45,-30 -20,-30" fill="#2E3A45"/>
    <polygon points="-15,10 40,10 32,-18 -7,-18" fill="#526B83"/>
  </g>

  <!-- Top-Right Analytics HUD -->
  <g transform="translate(560, 40)">
    <rect width="200" height="150" rx="4" fill="#0F1317" stroke="#313B45" stroke-width="1"/>
    <text x="14" y="24" fill="#F8F8F6" font-family="monospace" font-size="11" font-weight="bold">TRAFFIC FLOW TELEMETRY</text>
    
    <text x="14" y="52" fill="#8E9DAE" font-family="monospace" font-size="10">Total Count: <tspan fill="#FFFFFF" font-weight="bold">1,428 veh</tspan></text>
    <text x="14" y="74" fill="#8E9DAE" font-family="monospace" font-size="10">Avg Velocity: <tspan fill="#2A9D8F" font-weight="bold">64.2 km/h</tspan></text>
    <text x="14" y="96" fill="#8E9DAE" font-family="monospace" font-size="10">Congestion Index: <tspan fill="#E69542" font-weight="bold">LOW</tspan></text>
    <text x="14" y="118" fill="#8E9DAE" font-family="monospace" font-size="10">Pipeline Latency: <tspan fill="#2A9D8F" font-weight="bold">18 ms</tspan></text>
    
    <line x1="14" y1="130" x2="186" y2="130" stroke="#252D35" stroke-width="1"/>
    <text x="14" y="142" fill="#526B83" font-family="monospace" font-size="9">YOLOV8 • DEEPSORT • OPENCV</text>
  </g>

  <!-- Top-Left Badge -->
  <g transform="translate(40, 40)">
    <rect width="210" height="32" rx="4" fill="#0F1317" stroke="#526B83" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#2A9D8F"/>
    <text x="30" y="20" fill="#F8F8F6" font-family="monospace" font-size="11" letter-spacing="1">VEHICLE TRACKING CV</text>
  </g>
</svg>
